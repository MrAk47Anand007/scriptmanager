name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/ci.db
      AUTH_SECRET: ci-only-secret-not-for-production
      SESSION_SECRET: ci-only-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit
      - run: npm run build
