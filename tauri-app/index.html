<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScriptManager</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes
      // light. Must stay in sync with next-themes in src/App.tsx
      // (storageKey 'scriptmanager-theme', attribute 'class', enableSystem).
      ;(function () {
        try {
          var stored = localStorage.getItem('scriptmanager-theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* no localStorage — default to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
