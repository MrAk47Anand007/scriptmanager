[package]
name = "scriptmanager"
version = "0.1.0"
description = "A native desktop script manager built with Tauri"
authors = ["ScriptManager Contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "scriptmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = "0.8"
notify = "6.1"
git2 = "0.18"
reqwest = { version = "0.12", features = ["json"] }
boa_engine = "0.19"
tokio-stream = "0.1"
urlencoding = "2"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
cron = "0.12"
url = "2"
